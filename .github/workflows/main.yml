
name: Construir APK JARVIS

on:
  workflow_dispatch:
  push:
    branches:
      - principal

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Extrair projeto
        run: |
          mkdir -p /tmp/jarvis
          unzip -q JARVIS-Android-v1.0.zip -d /tmp/jarvis
          PROJECT_DIR=$(find /tmp/jarvis -name settings.gradle.kts -type f -printf '%h\n' | head -n 1)
          if [ -z "$PROJECT_DIR" ]; then
            echo "Projeto Android não encontrado no ZIP"
            exit 1
          fi
          cp -a "$PROJECT_DIR"/. .

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android
        uses: android-actions/setup-android@v3

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        run: gradle assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Android-APK
          path: app/build/outputs/apk/debug/*.apk
          
